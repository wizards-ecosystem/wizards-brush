version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # These upper bounds are runtime compatibility contracts. Keep safe updates
    # below them flowing without asking Dependabot to widen the supported stack.
    ignore:
      - dependency-name: torch
        versions: [">=2.12"]
      - dependency-name: torchvision
        versions: [">=0.27"]
      - dependency-name: protobuf
        versions: [">=6"]
      - dependency-name: mediapipe
        versions: [">=0.10.30"]
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # TypeScript 7 is outside typescript-eslint's current supported peer range.
    # Remove this boundary when the lint stack accepts TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
